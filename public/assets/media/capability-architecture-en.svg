<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790" role="img" aria-label="Conceptual model: owned capabilities, off-the-shelf components, and managed services connected through contracts, policies, and observability">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f8f8"/><stop offset="1" stop-color="#e9f1f0"/></linearGradient><linearGradient id="core" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0f565b"/><stop offset="1" stop-color="#0a303e"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0a3544" flood-opacity=".12"/></filter><marker id="arr" markerWidth="11" markerHeight="11" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#678f94" stroke-width="1.5"/></marker></defs>
<rect width="1400" height="790" rx="28" fill="url(#bg)"/>
<text x="70" y="70" font-size="32" font-family="Arial,sans-serif" font-weight="700" fill="#173342">One capability, different responsibilities</text>
<text x="70" y="104" font-size="18" font-family="Arial,sans-serif" fill="#597178">Reference architecture for build / buy / compose analysis — not IARA’s internal architecture</text>
<rect x="60" y="150" rx="20" width="355" height="486" fill="#fff" stroke="#d8e6e6" filter="url(#shadow)"/>
<text x="90" y="192" font-size="24" font-family="Arial,sans-serif" font-weight="700" fill="#25495a">Sourced capabilities</text>
<text x="90" y="223" font-size="16" font-family="Arial,sans-serif" fill="#6d7f83">Managed services and products</text>
<g font-family="Arial,sans-serif" font-size="20" fill="#204452"><rect x="90" y="257" width="296" height="70" rx="14" fill="#eef4f5"/><text x="114" y="299">Model APIs</text><rect x="90" y="348" width="296" height="70" rx="14" fill="#eef4f5"/><text x="114" y="390">Runtime / serving</text><rect x="90" y="439" width="296" height="70" rx="14" fill="#eef4f5"/><text x="114" y="481">Observability / evals</text><rect x="90" y="530" width="296" height="70" rx="14" fill="#eef4f5"/><text x="114" y="572">Connectors and tools</text></g>
<rect x="520" y="150" rx="20" width="355" height="486" fill="url(#core)" filter="url(#shadow)"/>
<text x="550" y="192" font-size="24" font-family="Arial,sans-serif" font-weight="700" fill="#fff">Controlled domain</text>
<text x="550" y="223" font-size="16" font-family="Arial,sans-serif" fill="#b6d7d9">Organization’s responsibility</text>
<g font-family="Arial,sans-serif" font-size="20" fill="#ecffff"><rect x="550" y="257" width="295" height="70" rx="14" fill="#1b6c70"/><text x="570" y="298">Business contracts</text><rect x="550" y="348" width="295" height="70" rx="14" fill="#1b6c70"/><text x="570" y="389">Identity and authorization</text><rect x="550" y="439" width="295" height="70" rx="14" fill="#1b6c70"/><text x="570" y="480">Quality criteria</text><rect x="550" y="530" width="295" height="70" rx="14" fill="#1b6c70"/><text x="570" y="571">Evidence and ownership</text></g>
<rect x="980" y="150" rx="20" width="355" height="486" fill="#fff" stroke="#d8e6e6" filter="url(#shadow)"/>
<text x="1010" y="192" font-size="24" font-family="Arial,sans-serif" font-weight="700" fill="#25495a">Products and processes</text>
<text x="1010" y="223" font-size="16" font-family="Arial,sans-serif" fill="#6d7f83">Observable business outcomes</text>
<g font-family="Arial,sans-serif" font-size="20" fill="#204452"><rect x="1010" y="257" width="296" height="70" rx="14" fill="#fff0df"/><text x="1034" y="299">Customer support</text><rect x="1010" y="348" width="296" height="70" rx="14" fill="#fff0df"/><text x="1034" y="390">Operations</text><rect x="1010" y="439" width="296" height="70" rx="14" fill="#fff0df"/><text x="1034" y="481">Legal / compliance</text><rect x="1010" y="530" width="296" height="70" rx="14" fill="#fff0df"/><text x="1034" y="572">Internal engineering</text></g>
<path d="M415 398 H520" stroke="#6b9b9d" stroke-width="4" fill="none" marker-end="url(#arr)"/>
<path d="M875 398 H980" stroke="#6b9b9d" stroke-width="4" fill="none" marker-end="url(#arr)"/>
<text x="472" y="379" font-size="14" font-family="Arial,sans-serif" fill="#537176" text-anchor="middle">APIs</text><text x="926" y="379" font-size="14" font-family="Arial,sans-serif" fill="#537176" text-anchor="middle">Service</text>
<rect x="60" y="676" width="1275" height="74" rx="15" fill="#f1e8da" stroke="#eedac0"/>
<text x="87" y="710" font-size="20" font-family="Arial,sans-serif" font-weight="700" fill="#6b4a27">Compose does not mean outsourcing responsibility</text>
<text x="87" y="733" font-size="16" font-family="Arial,sans-serif" fill="#6b5845">Each boundary needs a contract, applicable policy, observability, and an assigned owner.</text>
</svg>
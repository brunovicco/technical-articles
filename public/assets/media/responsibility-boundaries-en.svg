<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 920" role="img" aria-label="Conceptual agent platform architecture illustrating responsibility boundaries across the enterprise domain, platform runtime, and connected services" xml:lang="en">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f5f9f9"/><stop offset="1" stop-color="#e6f0f1"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-opacity=".12"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#567d86" stroke-width="1.7"/></marker></defs>
<rect width="1500" height="920" rx="28" fill="url(#bg)"/><g font-family="Arial, sans-serif"><text x="70" y="76" font-size="34" font-weight="bold" fill="#16333d">What changes when the platform owns the runtime?</text><text x="70" y="114" font-size="19" fill="#658088">Conceptual reference: boundaries and evaluation questions, not a vendor-specific architecture.</text>
<rect x="65" y="170" width="430" height="550" rx="24" fill="#fff" stroke="#d4e4e6" filter="url(#shadow)"/><text x="94" y="213" font-size="25" font-weight="bold" fill="#184653">Enterprise domain</text><text x="94" y="247" font-size="18" fill="#5f7b80">Contracts and authority</text>
<rect x="95" y="282" width="370" height="86" rx="15" fill="#e0f2f0"/><text x="120" y="317" font-size="21" font-weight="bold" fill="#24565d">User identity</text><text x="120" y="344" font-size="16" fill="#47656e">and delegated permissions</text>
<rect x="95" y="389" width="370" height="86" rx="15" fill="#e0f2f0"/><text x="120" y="424" font-size="21" font-weight="bold" fill="#24565d">Policy / authorization</text><text x="120" y="452" font-size="16" fill="#47656e">authorize before side effects</text>
<rect x="95" y="496" width="370" height="86" rx="15" fill="#e0f2f0"/><text x="120" y="531" font-size="21" font-weight="bold" fill="#24565d">Outcome contract</text><text x="120" y="558" font-size="16" fill="#47656e">acceptance, quality, provenance</text>
<rect x="550" y="170" width="430" height="550" rx="24" fill="#123d4b" filter="url(#shadow)"/><text x="579" y="213" font-size="25" font-weight="bold" fill="white">Runtime / platform</text><text x="579" y="247" font-size="18" fill="#b8d9da">Vendor-operated components</text>
<rect x="580" y="282" width="370" height="86" rx="15" fill="#1c5e68"/><text x="605" y="317" font-size="21" font-weight="bold" fill="white">Orchestration / execution</text><text x="605" y="344" font-size="16" fill="#cae6e5">isolation, queues, workers</text>
<rect x="580" y="389" width="370" height="86" rx="15" fill="#1c5e68"/><text x="605" y="424" font-size="21" font-weight="bold" fill="white">State and recovery</text><text x="605" y="452" font-size="16" fill="#cae6e5">checkpoints, retries, idempotency</text>
<rect x="580" y="496" width="370" height="86" rx="15" fill="#1c5e68"/><text x="605" y="531" font-size="21" font-weight="bold" fill="white">Traces and metrics</text><text x="605" y="558" font-size="16" fill="#cae6e5">export and integrity</text>
<rect x="1035" y="170" width="400" height="550" rx="24" fill="#fff" stroke="#d4e4e6" filter="url(#shadow)"/><text x="1064" y="213" font-size="25" font-weight="bold" fill="#184653">Connected services</text><text x="1064" y="247" font-size="18" fill="#5f7b80">Multiple charges and contracts</text>
<rect x="1065" y="282" width="340" height="86" rx="15" fill="#fff0de"/><text x="1090" y="317" font-size="21" font-weight="bold" fill="#6b4b2d">Models / inference</text><text x="1090" y="344" font-size="16" fill="#896946">tokens, cache, reservations</text>
<rect x="1065" y="389" width="340" height="86" rx="15" fill="#fff0de"/><text x="1090" y="424" font-size="21" font-weight="bold" fill="#6b4b2d">Tools and connectors</text><text x="1090" y="452" font-size="16" fill="#896946">MCP, APIs, licenses</text>
<rect x="1065" y="496" width="340" height="86" rx="15" fill="#fff0de"/><text x="1090" y="531" font-size="21" font-weight="bold" fill="#6b4b2d">Search / data</text><text x="1090" y="558" font-size="16" fill="#896946">indexing, ACLs, retention</text>
<path d="M495 437 H550" stroke="#5d8891" stroke-width="4" marker-end="url(#arrow)" fill="none"/><path d="M980 437 H1035" stroke="#5d8891" stroke-width="4" marker-end="url(#arrow)" fill="none"/>
<rect x="65" y="762" width="1370" height="108" rx="18" fill="#e7e5d8" stroke="#d4c9aa"/><text x="96" y="806" font-size="25" font-weight="bold" fill="#625233">Questions spanning every layer</text><text x="96" y="842" font-size="20" fill="#655c47">Who authorizes? Who recovers from failure? Who sees traces? Who pays? How do we migrate?</text></g></svg>

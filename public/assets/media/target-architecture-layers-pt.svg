<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Arquitetura-alvo por responsabilidade"><title>Arquitetura-alvo por responsabilidade</title><defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#102d43"/><stop offset="100%" stop-color="#061723"/></linearGradient><radialGradient id="halo" cx="74%" cy="10%" r="95%"><stop stop-color="#1c6671" stop-opacity=".38"/><stop offset="1" stop-color="#071b2d" stop-opacity="0"/></radialGradient></defs><rect width="1280" height="720" rx="20" fill="url(#grad)"/><rect width="1280" height="720" rx="20" fill="url(#halo)"/><path d="M50 637 H1230" stroke="#315262" stroke-width="1"/><text x="52" y="678" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="17" fill="#a8c0cb">Responsabilidades são separadas por contrato, não por produto</text><text x="1228" y="678" text-anchor="end" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="16" fill="#a8c0cb">Ilustração autoral · cenário hipotético</text><text x="52" y="73" font-size="33" font-weight="700" fill="#eff9fb" font-family="Inter, DejaVu Sans, Arial, sans-serif">ARQUITETURA-ALVO POR RESPONSABILIDADE</text><text x="52" y="113" font-size="20" font-weight="500" fill="#a8c0cb" font-family="Inter, DejaVu Sans, Arial, sans-serif">Reutilização não exige centralizar a lógica de todas as aplicações</text><rect x="52" y="158" width="1176" height="105" rx="18" fill="#264453" stroke="#eff9fb" stroke-width="1.6"/><rect x="73" y="178" width="7" height="65" rx="4" fill="#eff9fb" stroke="#eff9fb" stroke-width="1.6"/><text x="108" y="198" font-size="23" font-weight="750" fill="#eff9fb" font-family="Inter, DejaVu Sans, Arial, sans-serif">Jornadas e produtos</text><text x="108" y="234" font-size="19" font-weight="500" fill="#a8c0cb" font-family="Inter, DejaVu Sans, Arial, sans-serif">Atendimento   ·   Jurídico   ·   Operações   ·   Engenharia</text><rect x="52" y="263" width="1176" height="106" rx="18" fill="#3c3a35" stroke="#f7ba69" stroke-width="1.6"/><rect x="73" y="283" width="7" height="66" rx="4" fill="#f7ba69" stroke="#f7ba69" stroke-width="1.6"/><text x="108" y="303" font-size="23" font-weight="750" fill="#eff9fb" font-family="Inter, DejaVu Sans, Arial, sans-serif">Domínio dos produtos</text><text x="108" y="339" font-size="19" font-weight="500" fill="#a8c0cb" font-family="Inter, DejaVu Sans, Arial, sans-serif">Regras de negócio   ·   Tools especializadas   ·   Critérios de aceite</text><rect x="52" y="370" width="1176" height="120" rx="18" fill="#11444d" stroke="#55dbd0" stroke-width="1.6"/><rect x="73" y="390" width="7" height="80" rx="4" fill="#55dbd0" stroke="#55dbd0" stroke-width="1.6"/><text x="108" y="410" font-size="23" font-weight="750" fill="#eff9fb" font-family="Inter, DejaVu Sans, Arial, sans-serif">Plataforma compartilhada</text><text x="108" y="446" font-size="19" font-weight="500" fill="#a8c0cb" font-family="Inter, DejaVu Sans, Arial, sans-serif">Gateway de modelos   ·   Identidade e políticas   ·   Observabilidade</text><rect x="52" y="500" width="1176" height="102" rx="18" fill="#123e59" stroke="#75b9f5" stroke-width="1.6"/><rect x="73" y="520" width="7" height="62" rx="4" fill="#75b9f5" stroke="#75b9f5" stroke-width="1.6"/><text x="108" y="540" font-size="23" font-weight="750" fill="#eff9fb" font-family="Inter, DejaVu Sans, Arial, sans-serif">Fundação corporativa</text><text x="108" y="576" font-size="19" font-weight="500" fill="#a8c0cb" font-family="Inter, DejaVu Sans, Arial, sans-serif">Dados   ·   IAM   ·   Redes   ·   Segurança   ·   SRE</text><line x1="1138" y1="253" x2="1138" y2="275" stroke="#f7ba69" stroke-width="2" stroke-linecap="round"/><path d="M 1133.2 265.1 L 1138 275 L 1142.8 265.1" fill="none" stroke="#f7ba69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="1138" y1="359" x2="1138" y2="381" stroke="#f7ba69" stroke-width="2" stroke-linecap="round"/><path d="M 1133.2 371.1 L 1138 38
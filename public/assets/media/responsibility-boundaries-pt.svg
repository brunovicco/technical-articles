<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 920" role="img" aria-label="Arquitetura de avaliação de plataformas de agentes com fronteiras entre negócio, runtime e serviços">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f5f9f9"/><stop offset="1" stop-color="#e6f0f1"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-opacity=".12"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#567d86" stroke-width="1.7"/></marker></defs>
<rect width="1500" height="920" rx="28" fill="url(#bg)"/><g font-family="Arial, sans-serif"><text x="70" y="76" font-size="34" font-weight="bold" fill="#16333d">O que muda quando a plataforma assume o runtime?</text><text x="70" y="114" font-size="19" fill="#658088">Referência conceitual: fronteiras e perguntas de avaliação, não arquitetura de um fornecedor específico.</text>
<rect x="65" y="170" width="430" height="550" rx="24" fill="#fff" stroke="#d4e4e6" filter="url(#shadow)"/><text x="94" y="213" font-size="25" font-weight="bold" fill="#184653">Domínio da empresa</text><text x="94" y="247" font-size="18" fill="#5f7b80">Contratos e autoridade</text>
<rect x="95" y="282" width="370" height="86" rx="15" fill="#e0f2f0"/><text x="120" y="317" font-size="21" font-weight="bold" fill="#24565d">Identidade de usuário</text><text x="120" y="344" font-size="16" fill="#47656e">e delegação de permissões</text>
<rect x="95" y="389" width="370" height="86" rx="15" fill="#e0f2f0"/><text x="120" y="424" font-size="21" font-weight="bold" fill="#24565d">Policy / autorização</text><text x="120" y="452" font-size="16" fill="#47656e">ação antes do side effect</text>
<rect x="95" y="496" width="370" height="86" rx="15" fill="#e0f2f0"/><text x="120" y="531" font-size="21" font-weight="bold" fill="#24565d">Contrato de resultado</text><text x="120" y="558" font-size="16" fill="#47656e">aceite, qualidade, proveniência</text>
<rect x="550" y="170" width="430" height="550" rx="24" fill="#123d4b" filter="url(#shadow)"/><text x="579" y="213" font-size="25" font-weight="bold" fill="white">Runtime / plataforma</text><text x="579" y="247" font-size="18" fill="#b8d9da">Parte operada pelo fornecedor</text>
<rect x="580" y="282" width="370" height="86" rx="15" fill="#1c5e68"/><text x="605" y="317" font-size="21" font-weight="bold" fill="white">Orquestração / execução</text><text x="605" y="344" font-size="16" fill="#cae6e5">isolamento, filas, workers</text>
<rect x="580" y="389" width="370" height="86" rx="15" fill="#1c5e68"/><text x="605" y="424" font-size="21" font-weight="bold" fill="white">Estado e retomada</text><text x="605" y="452" font-size="16" fill="#cae6e5">checkpoint, retry e idempotência</text>
<rect x="580" y="496" width="370" height="86" rx="15" fill="#1c5e68"/><text x="605" y="531" font-size="21" font-weight="bold" fill="white">Traces e métricas</text><text x="605" y="558" font-size="16" fill="#cae6e5">exportação e integridade</text>
<rect x="1035" y="170" width="400" height="550" rx="24" fill="#fff" stroke="#d4e4e6" filter="url(#shadow)"/><text x="1064" y="213" font-size="25" font-weight="bold" fill="#184653">Serviços conectados</text><text x="1064" y="247" font-size="18" fill="#5f7b80">Muitas cobranças e contratos</text>
<rect x="1065" y="282" width="340" height="86" rx="15" fill="#fff0de"/><text x="1090" y="317" font-size="21" font-weight="bold" fill="#6b4b2d">Modelos / inferência</text><text x="1090" y="344" font-size="16" fill="#896946">tokens, cache, reserva</text>
<rect x="1065" y="389" width="340" height="86" rx="15" fill="#fff0de"/><text x="1090" y="424" font-size="21" font-weight="bold" fill="#6b4b2d">Tools e conectores</text><text x="1090" y="452" font-size="16" fill="#896946">MCP, APIs, licenças</text>
<rect x="1065" y="496" width="340" height="86" rx="15" fill="#fff0de"/><text x="1090" y="531" font-size="21" font-weight="bold" fill="#6b4b2d">Busca / dados</text><text x="1090" y="558" font-size="16" fill="#896946">indexação, ACL e retenção</text>
<path d="M495 437 H550" stroke="#5d8891" stroke-width="4" marker-end="url(#arrow)" fill="none"/><path d="M980 437 H1035" stroke="#5d8891" stroke-width="4" marker-end="url(#arrow)" fill="none"/>
<rect x="65" y="762" width="1370" height="108" rx="18" fill="#e7e5d8" stroke="#d4c9aa"/><text x="96" y="806" font-size="25" font-weight="bold" fill="#625233">Perguntas que atravessam todas as caixas</text><text x="96" y="842" font-size="20" fill="#655c47">Quem autoriza? Quem recupera após falha? Quem vê o trace? Quem paga? Como migrar?</text></g></svg>
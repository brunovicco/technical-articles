ze="21" font-weight="500" text-anchor="middle">Cost per outcome</text><rect x="1055" y="493" width="340" height="58" rx="9" fill="#102a42" stroke="#f1ad62" stroke-width="1.6"/><text x="1225.0" y="530" fill="#f0f6fc" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="500" text-anchor="middle">TCO / forecast</text><path d="M450 388 L545 388" fill="none" stroke="#35c8bd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M935 388 L1030 388" fill="none" stroke="#35c8bd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="740" y="672" fill="#a4bdce" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="middle">A trace helps with attribution; outcomes must be validated by a trusted source</text></svg>
</defs><rect width="1480" height="740" rx="20" fill="url(#bg)"/><text x="740" y="65" fill="#f0f6fc" font-family="Inter, Arial, sans-serif" font-size="37" font-weight="700" text-anchor="middle">From technical usage to cost per outcome</text><text x="740" y="103" fill="#a4bdce" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="middle">Instrument without collecting unnecessary personal data</text><rect x="65" y="180" width="380" height="420" rx="18" fill="url(#card)" stroke="#2b4963" stroke-width="1.6"/><text x="255.0" y="229" fill="#f0f6fc" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">TECHNICAL SIGNALS</text><rect x="85" y="262" width="340" height="58" rx="9" fill="#102a42" stroke="#77acfc" stroke-width="1.6"/><text x="255.0" y="299" fill="#f0f6fc" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="500" text-anchor="middle">API and billing</text><rect x="85" y="339" width="340" height="58" rx="9" fill="#102a42" stroke="#77acfc" stroke-width="1.6"/><text x="255.0" y="376" fill="#f0f6fc" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="500" text-anchor="middle">Tokens / model</text><rect x="85" y="416" width="340" height="58" rx="9" fill="#102a42" stroke="#77acfc" stroke-width="1.6"/><text x="255.0" y="453" fill="#f0f6fc" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="500" text-anchor="middle">Runtime / memory</text><rect x="85" y="493" width="340" height="58" rx="9" fill="#102a42" stroke="#77acfc" stroke-width="1.6"/><text x="255.0" y="530" fill="#f0f6fc" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="500" text-anchor="middle">Tools / storage</text><rect x="550" y="180" width="380" height="420" rx="18" fill="url(#card)" stroke="#2b4963" stroke-width="1.6"/><text x="740.0" y="229" fill="#f0f6fc" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">RECONCILIATION</text><rect x=
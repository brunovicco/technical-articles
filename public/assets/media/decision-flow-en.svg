<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="900" viewBox="0 0 1300 900" role="img" aria-label="AI capability decision flowchart: mandatory requirements, differentiation, product fit, and economic validation">
<defs><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#132d3c" flood-opacity=".12"/></filter><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5b858b" stroke-width="1.5"/></marker></defs>
<rect width="1300" height="900" rx="26" fill="#f5f8f8"/>
<text x="50" y="59" font-size="30" font-weight="700" fill="#193945" font-family="Arial">A framework for Build, Buy, or Compose decisions</text>
<text x="50" y="90" font-size="17" fill="#627a81" font-family="Arial">Author-proposed flow; final decisions depend on benchmarks, contracts, risk, and context.</text>
<g font-family="Arial" text-anchor="middle"><rect x="445" y="122" width="410" height="76" rx="17" fill="#174f5d" filter="url(#s)"/><text x="650" y="152" fill="white" font-size="21" font-weight="700">Define the business capability</text><text x="650" y="177" fill="#c6e3e5" font-size="16">outcomes, users, systems, and volume</text>
<rect x="444" y="237" width="412" height="80" rx="17" fill="#e2edf0" stroke="#8cafb6"/><text x="650" y="269" fill="#1b4453" font-size="20" font-weight="700">Are mandatory requirements met?</text><text x="650" y="294" fill="#577880" font-size="16">data, security, authority, region</text>
<rect x="910" y="238" width="310" height="79" rx="17" fill="#ffe4db" stroke="#dc9d88"/><text x="1065" y="269" fill="#88452e" font-size="19" font-weight="700">Reject this option</text><text x="1065" y="292" fill="#88452e" font-size="16">or redesign the scope</text>
<rect x="442" y="365" width="416" height="78" rx="17" fill="#e2edf0" stroke="#8cafb6"/><text x="650" y="397" fill="#1b4453" font-size="20" font-weight="700">Does it differentiate the business?</text><text x="650" y="421" fill="#577880" font-size="16">do control and evolution matter?</text>
<rect x="66" y="515" width="349" height="102" rx="18" fill="#d9efed" stroke="#77bcb1" filter="url(#s)"/><text x="241" y="550" fill="#174b4c" font-size="25" font-weight="700">BUILD</text><text x="241" y="575" fill="#366368" font-size="17">Own the logic and contracts</text><text x="241" y="598" fill="#366368" font-size="17">where differentiation matters</text>
<rect x="476" y="515" width="348" height="102" rx="18" fill="#e8e9f2" stroke="#a6abc7" filter="url(#s)"/><text x="650" y="550" fill="#38496c" font-size="25" font-weight="700">BUY</text><text x="650" y="575" fill="#596481" font-size="17">Well-fitting product with</text><text x="650" y="598" fill="#596481" font-size="17">vendor-led evolution</text>
<rect x="886" y="515" width="348" height="102" rx="18" fill="#fff0dd" stroke="#e5c78c" filter="url(#s)"/><text x="1060" y="550" fill="#795020" font-size="25" font-weight="700">COMPOSE</text><text x="1060" y="575" fill="#80643e" font-size="17">Own contracts, managed</text><text x="1060" y="598" fill="#80643e" font-size="17">services, and integrations</text>
<rect x="385" y="680" width="532" height="82" rx="17" fill="#174f5d" filter="url(#s)"/><text x="650" y="713" fill="white" font-size="21" font-weight="700">Validate before deciding</text><text x="650" y="739" fill="#c6e3e5" font-size="17">TCO, quality, risk, portability, and pilot</text>
<rect x="385" y="806" width="532" height="51" rx="16" fill="#eef0df" stroke="#b1b995"/><text x="650" y="839" font-size="19" font-weight="700" fill="#4f6736">Record the decision and review date</text></g>
<g fill="none" stroke="#72979c" stroke-width="3" marker-end="url(#a)"><path d="M650 198 V237"/><path d="M856 277 H910"/><path d="M650 317 V365"/><path d="M570 443 V479 H241 V515"/><path d="M650 443 V515"/><path d="M730 443 V479 H1060 V515"/><path d="M241 617 V652 H550 V680"/><path d="M650 617 V680"/><path d="M1060 617 V652 H750 V680"/><path d="M650 762 V806"/></g>
<g font-family="Arial" font-size="15" font-weight="700" fill="#54757c"><text x="875" y="264">NO</text><text x="666" y="347">YES</text><text x="272" y="469">YES</text><text x="664" y="471">NO *</text><text x="966" y="471">COMBINATION</text></g>
<text x="52" y="883" font-family="Arial" font-size="15" fill="#68818a">* If no product fits well enough, compare a composed solution. These are candidate paths, not automatic decisions.</text>
</svg>